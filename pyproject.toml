[project]
name = "aishorts"
version = "0.2.0"
description = "PDF-to-brainrot AI short generator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.13.3",
    "alembic==1.13.1",
    "audioop-lts; python_version >= '3.13'",
    "boto3==1.42.72",
    "elevenlabs==2.40.0",
    "fastapi==0.135.2",
    "firebase-admin==7.3.0",
    "google-genai",
    "matplotlib==3.10.8",
    "openai==2.29.0",
    "pillow==12.1.1",
    "playwright==1.58.0",
    "protobuf",
    "psycopg[binary]",
    "pydantic==2.12.5",
    "pydub==0.25.1",
    "pypdf==6.9.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-pptx==1.0.2",
    "requests==2.32.5",
    "runpod==1.8.2",
    "sqlalchemy==2.0.48",
    "sqlmodel==0.0.37",
    "stripe==14.4.1",
]


[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
